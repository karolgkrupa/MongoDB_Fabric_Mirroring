[project]
name = "mongodb-fabric-mirroring"
version = "1.0.0"
description = "Near real-time mirroring of MongoDB Atlas data into Microsoft Fabric OneLake."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "flask>=3.1.3",
    "pymongo>=4.17.0",
    "pandas>=3.0.2",
    "numpy>=2.4.4",
    "pyarrow>=24.0.0",
    "fastparquet>=2026.3.0",
    "python-dotenv>=1.2.2",
    "requests>=2.33.1",
]

[tool.uv]
# This repo uses a flat module layout (top-level *.py files) and is run directly,
# not built/installed as a distributable package. Treat it as a virtual project so
# `uv sync` only manages the dependency environment in .venv.
package = false
